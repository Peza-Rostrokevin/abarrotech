<div class="register-container">
  <div class="register-card">
    <h1>Registro de Vendedor</h1>
    <p class="subtitle">Crea tu cuenta para vender en el catálogo</p>

    <div *ngIf="!inviteToken" class="error-box">{{ error }}</div>

    <form *ngIf="inviteToken" (ngSubmit)="onSubmit()" #registerForm="ngForm">
      <div class="form-group">
        <label for="name">Nombre</label>
        <input
          type="text"
          id="name"
          name="name"
          [(ngModel)]="name"
          required
          placeholder="Tu nombre o el de tu negocio"
        />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          required
          placeholder="tucorreo@ejemplo.com"
        />
      </div>

      <div class="form-group">
        <label for="phone">WhatsApp *</label>
        <input
          type="tel"
          id="phone"
          name="phone"
          [(ngModel)]="phone"
          required
          maxlength="10"
          minlength="10"
          pattern="[0-9]{10}"
          placeholder="10 dígitos, ej: 3312345678"
        />
        <small class="field-hint">Debe ser un número de 10 dígitos (sin espacios ni guiones)</small>
      </div>

      <div class="form-group">
        <label for="password">Contraseña (mínimo 6 caracteres)</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          required
          minlength="6"
          placeholder="••••••••"
        />
      </div>

      <div *ngIf="error" class="error-box">{{ error }}</div>

      <button type="submit" class="btn-primary" [disabled]="loading">
        {{ loading ? 'Registrando...' : 'Crear Cuenta' }}
      </button>
    </form>

    <p class="login-link">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
    </p>
  </div>
</div>
